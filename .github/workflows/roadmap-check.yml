name: Canonical Plan Checks
on:
  pull_request:
  push:
    branches:
      - main
      - 'plan/**'
permissions:
  contents: read
concurrency:
  group: roadmap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate complete canonical registry and readable plan
        run: node scripts/validate-pr-registry.mjs
      - name: Schema regression tests
        run: node --test tests/registry.test.mjs
