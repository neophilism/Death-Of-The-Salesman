name: Foundation Shell

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm scan:secrets
      - run: pnpm test:failure-contract
      - run: pnpm audit:dependencies
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test independently runnable services
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/dots-web.log 2>&1 &
          web_pid=$!
          API_PORT=3001 pnpm start:api > /tmp/dots-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$web_pid" "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/web-health.json &&
               curl --fail --silent http://127.0.0.1:3001/health > /tmp/api-health.json; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              cat /tmp/dots-web.log /tmp/dots-api.log
              exit 1
            fi
            sleep 1
          done
          grep --fixed-strings '"status":"ok"' /tmp/web-health.json
          grep --fixed-strings '"status":"ok"' /tmp/api-health.json
          pnpm start:worker

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dots_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dots_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dots_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Apply, inspect, roll back, and reapply migrations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/migrate.mjs up
          node scripts/migrate.mjs up
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM app_meta.schema_migrations")" = "9"
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(DISTINCT app.new_id()) FROM generate_series(1,100)")" = "100"
          test "$(psql "$DATABASE_URL" -Atc "SELECT pg_typeof(app.utc_now())::text")" = "timestamp with time zone"
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO app.organizations(id, slug, display_name) VALUES
            ('11111111-1111-4111-8111-111111111111', 'first-org', 'First Organization'),
            ('22222222-2222-4222-8222-222222222222', 'second-org', 'Second Organization');
          INSERT INTO app.owner_users(id, identity_subject, display_name) VALUES
            ('33333333-3333-4333-8333-333333333333', 'oidc|first', 'First Owner'),
            ('44444444-4444-4444-8444-444444444444', 'oidc|second', 'Second Owner');
          INSERT INTO app.memberships(id, organization_id, user_id, role) VALUES
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', '11111111-1111-4111-8111-111111111111', '33333333-3333-4333-8333-333333333333', 'owner'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', '22222222-2222-4222-8222-222222222222', '44444444-4444-4444-8444-444444444444', 'owner');
          INSERT INTO app.projects(id, organization_id, label, content, updated_by_membership_id)
            VALUES (
              '55555555-5555-4555-8555-555555555555',
              '11111111-1111-4111-8111-111111111111',
              'Launch', '{"summary":"Synthetic"}'::jsonb,
              'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
            );
          INSERT INTO app.offers(id, organization_id, project_id, label, content, updated_by_membership_id)
            VALUES (
              '66666666-6666-4666-8666-666666666666',
              '11111111-1111-4111-8111-111111111111',
              '55555555-5555-4555-8555-555555555555',
              'Launch offer', '{"currency":"USD"}'::jsonb,
              'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
            );
          INSERT INTO app.pricing_summaries(
            id, organization_id, project_id, offer_id, label, content, updated_by_membership_id
          ) VALUES (
            '77777777-7777-4777-8777-777777777777',
            '11111111-1111-4111-8111-111111111111',
            '55555555-5555-4555-8555-555555555555',
            '66666666-6666-4666-8666-666666666666',
            'Pricing', '{"amountMinor":2500}'::jsonb,
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
          );
          INSERT INTO app.vetted_product_facts(
            id, organization_id, project_id, offer_id, label, content, updated_by_membership_id
          ) VALUES (
            '88888888-8888-4888-8888-888888888888',
            '11111111-1111-4111-8111-111111111111',
            '55555555-5555-4555-8555-555555555555',
            '66666666-6666-4666-8666-666666666666',
            'Vetted fact', '{"statement":"Synthetic only"}'::jsonb,
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
          );
          INSERT INTO app.project_buckets(
            id, organization_id, project_id, campaign_id, label, default_position, updated_by_membership_id
          ) VALUES (
            '99999999-9999-4999-8999-999999999999',
            '11111111-1111-4111-8111-111111111111',
            '55555555-5555-4555-8555-555555555555',
            'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee',
            'Launch bucket', 0,
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
          );
          INSERT INTO app.project_bucket_preferences(
            organization_id, owner_membership_id, bucket_id, visible, display_position
          ) VALUES (
            '11111111-1111-4111-8111-111111111111',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            '99999999-9999-4999-8999-999999999999',
            false, 3
          );
          INSERT INTO app.agent_identities(
            id, organization_id, approved_name_id, display_name, updated_by_membership_id
          ) VALUES
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd', '11111111-1111-4111-8111-111111111111', 98, 'Fast Eddie Felson', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),
            ('eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee', '11111111-1111-4111-8111-111111111111', 59, 'Harry Wormwood', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa');
          UPDATE app.projects
             SET label = 'Launch v2', version = version + 1, updated_at = app.utc_now()
           WHERE id = '55555555-5555-4555-8555-555555555555' AND version = 1;
          UPDATE app.projects
             SET label = 'stale write', version = version + 1
           WHERE id = '55555555-5555-4555-8555-555555555555' AND version = 1;
          UPDATE app.offers
             SET status = 'archived', version = version + 1, updated_at = app.utc_now()
           WHERE id = '66666666-6666-4666-8666-666666666666' AND version = 1;
          INSERT INTO app.organization_settings(organization_id, updated_by_membership_id)
            VALUES ('11111111-1111-4111-8111-111111111111', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa');
          SQL
          test "$(psql "$DATABASE_URL" -Atc "SELECT label || ':' || status || ':' || version FROM app.projects WHERE id = '55555555-5555-4555-8555-555555555555'")" = "Launch v2:active:2"
          test "$(psql "$DATABASE_URL" -Atc "SELECT label || ':' || status || ':' || version FROM app.offers WHERE id = '66666666-6666-4666-8666-666666666666'")" = "Launch offer:archived:2"
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM app.pricing_summaries WHERE offer_id = '66666666-6666-4666-8666-666666666666'")" = "1"
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM app.vetted_product_facts WHERE offer_id = '66666666-6666-4666-8666-666666666666'")" = "1"
          test "$(psql "$DATABASE_URL" -Atc "SELECT visible || ':' || display_position || ':' || version FROM app.project_bucket_preferences WHERE bucket_id = '99999999-9999-4999-8999-999999999999'")" = "false:3:1"
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM app.approved_agent_names")" = "264"
          test "$(psql "$DATABASE_URL" -Atc "SELECT string_agg(display_name, ',' ORDER BY approved_name_id DESC) FROM app.agent_identities WHERE organization_id = '11111111-1111-4111-8111-111111111111'")" = "Fast Eddie Felson,Harry Wormwood"
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM app.agent_identities WHERE organization_id = '22222222-2222-4222-8222-222222222222'")" = "0"
          test "$(psql "$DATABASE_URL" -Atc "SELECT to_regclass('app.agent_project_assignments') IS NOT NULL")" = "t"
          if psql "$DATABASE_URL" --set ON_ERROR_STOP=1 -c "UPDATE app.approved_agent_names SET name = 'tampered' WHERE id = 1"; then
            echo "immutable approved-name catalog unexpectedly changed" >&2
            exit 1
          fi
          if psql "$DATABASE_URL" --set ON_ERROR_STOP=1 -c "
            INSERT INTO app.organization_settings(organization_id, updated_by_membership_id)
            VALUES ('22222222-2222-4222-8222-222222222222', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa')
          "; then
            echo "cross-tenant membership reference unexpectedly succeeded" >&2
            exit 1
          fi
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO app.auth_identities(user_id, issuer, subject)
            VALUES ('33333333-3333-4333-8333-333333333333', 'https://identity.example', 'owner-1');
          INSERT INTO app.organization_auth_policies(organization_id)
            VALUES ('11111111-1111-4111-8111-111111111111');
          INSERT INTO app.owner_sessions(
            organization_id, user_id, membership_id, token_hash, csrf_hash,
            expires_at, idle_expires_at, idle_timeout_seconds
          ) VALUES (
            '11111111-1111-4111-8111-111111111111',
            '33333333-3333-4333-8333-333333333333',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            decode(repeat('11', 32), 'hex'), decode(repeat('22', 32), 'hex'),
            app.utc_now() + interval '1 hour', app.utc_now() + interval '15 minutes', 900
          );
          SQL
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO app.delegation_grants(
            organization_id, principal_kind, principal_subject, scopes,
            resource_filter, created_by_membership_id, expires_at
          ) VALUES (
            '11111111-1111-4111-8111-111111111111', 'agent', 'agent-17',
            ARRAY['projects:read', 'contacts:read'],
            '{"projectIds":["project-1"],"campaignIds":[],"contactIds":["contact-1"]}'::jsonb,
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', app.utc_now() + interval '1 hour'
          );
          SQL
          if psql "$DATABASE_URL" --set ON_ERROR_STOP=1 -c "
            INSERT INTO app.delegation_grants(
              organization_id, principal_kind, principal_subject, scopes,
              resource_filter, created_by_membership_id, expires_at
            ) VALUES (
              '22222222-2222-4222-8222-222222222222', 'agent', 'cross-tenant',
              ARRAY['projects:read'], '{}'::jsonb,
              'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', app.utc_now() + interval '1 hour'
            )
          "; then
            echo "cross-tenant delegation issuer unexpectedly succeeded" >&2
            exit 1
          fi
          if psql "$DATABASE_URL" --set ON_ERROR_STOP=1 -c "
            INSERT INTO app.delegation_grants(
              organization_id, principal_kind, principal_subject, scopes,
              resource_filter, created_by_membership_id, expires_at
            ) VALUES (
              '11111111-1111-4111-8111-111111111111', 'agent', 'over-scoped',
              ARRAY['organization:transfer'], '{}'::jsonb,
              'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', app.utc_now() + interval '1 hour'
            )
          "; then
            echo "owner-only agent scope unexpectedly succeeded" >&2
            exit 1
          fi
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE dots_tenant_one NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE dots_tenant_two NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE dots_tenant_unbound NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT USAGE ON SCHEMA app TO dots_tenant_one, dots_tenant_two, dots_tenant_unbound;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA app
            TO dots_tenant_one, dots_tenant_two, dots_tenant_unbound;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA app
            TO dots_tenant_one, dots_tenant_two, dots_tenant_unbound;
          GRANT dots_tenant_one, dots_tenant_two, dots_tenant_unbound TO CURRENT_USER;
          SQL
          test "$(psql "$DATABASE_URL" -Atq -c "
            SET ROLE dots_tenant_one;
            SET app.organization_id = '11111111-1111-4111-8111-111111111111';
            SELECT string_agg(slug, ',' ORDER BY slug) FROM app.organizations
          ")" = "first-org"
          test "$(psql "$DATABASE_URL" -Atq -c "
            SET ROLE dots_tenant_one;
            SET app.organization_id = '11111111-1111-4111-8111-111111111111';
            SELECT count(*) FROM app.organizations
              WHERE id = '22222222-2222-4222-8222-222222222222'
          ")" = "0"
          test "$(psql "$DATABASE_URL" -Atq -c "
            SET ROLE dots_tenant_one;
            SET app.organization_id = '11111111-1111-4111-8111-111111111111';
            SELECT string_agg(owner_users.identity_subject, ',' ORDER BY owner_users.identity_subject)
            FROM app.memberships
            JOIN app.owner_users ON owner_users.id = memberships.user_id
          ")" = "oidc|first"
          test "$(psql "$DATABASE_URL" -Atq -c "
            SET ROLE dots_tenant_two;
            SET app.organization_id = '22222222-2222-4222-8222-222222222222';
            SELECT string_agg(owner_users.identity_subject, ',' ORDER BY owner_users.identity_subject)
            FROM app.memberships
            JOIN app.owner_users ON owner_users.id = memberships.user_id
          ")" = "oidc|second"
          test "$(psql "$DATABASE_URL" -Atq -c "
            SET ROLE dots_tenant_unbound;
            SELECT count(*) FROM app.organizations
          ")" = "0"
          if psql "$DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          SET ROLE dots_tenant_one;
          SET app.organization_id = '11111111-1111-4111-8111-111111111111';
          INSERT INTO app.organization_settings(organization_id, updated_by_membership_id)
            VALUES ('22222222-2222-4222-8222-222222222222', 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');
          SQL
          then
            echo "cross-tenant RLS insert unexpectedly succeeded" >&2
            exit 1
          fi
          test "$(psql "$DATABASE_URL" -Atq -c "
            SET ROLE dots_tenant_one;
            SET app.organization_id = '11111111-1111-4111-8111-111111111111';
            UPDATE app.memberships SET status = 'inactive'
              WHERE id = 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'
              RETURNING id
          ")" = ""
          node scripts/migrate.mjs down
          test "$(psql "$DATABASE_URL" -Atc "SELECT to_regclass('app.agent_project_assignments') IS NULL")" = "t"
          node scripts/migrate.mjs down
          test "$(psql "$DATABASE_URL" -Atc "SELECT to_regclass('app.agent_identities') IS NULL")" = "t"
          test "$(psql "$DATABASE_URL" -Atc "SELECT to_regclass('app.approved_agent_names') IS NULL")" = "t"
          node scripts/migrate.mjs down
          test "$(psql "$DATABASE_URL" -Atc "SELECT to_regclass('app.project_buckets') IS NULL")" = "t"
          test "$(psql "$DATABASE_URL" -Atc "SELECT to_regclass('app.project_bucket_preferences') IS NULL")" = "t"
          node scripts/migrate.mjs down
          test "$(psql "$DATABASE_URL" -Atc "SELECT to_regclass('app.projects') IS NULL")" = "t"
          node scripts/migrate.mjs down
          test "$(psql "$DATABASE_URL" -Atc "SELECT to_regprocedure('app.current_organization_id()') IS NULL")" = "t"
          node scripts/migrate.mjs down
          test "$(psql "$DATABASE_URL" -Atc "SELECT to_regclass('app.delegation_grants') IS NULL")" = "t"
          node scripts/migrate.mjs down
          test "$(psql "$DATABASE_URL" -Atc "SELECT to_regclass('app.owner_sessions') IS NULL")" = "t"
          node scripts/migrate.mjs down
          test "$(psql "$DATABASE_URL" -Atc "SELECT to_regclass('app.organizations') IS NULL")" = "t"
          node scripts/migrate.mjs down
          test "$(psql "$DATABASE_URL" -Atc "SELECT to_regnamespace('app') IS NULL")" = "t"
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM app_meta.schema_migrations")" = "0"
          node scripts/migrate.mjs up
